<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive 3D simulation of linear algebra matrix transformations — see how neural network weight matrices transform data in AI.">
  <title>Linear Algebra — AI Math Toolkits</title>
  <link rel="stylesheet" href="../common/styles.css">
  <link rel="stylesheet" href="../common/components.css">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- Navigation -->
  <header class="nav" id="nav-bar"></header>

  <!-- Main Layout -->
  <main class="page-body">
    <div class="sim-layout">
      <!-- Side Panel -->
      <div class="side-panel">
        <!-- Input Panel -->
        <div class="panel animate-fade-in-up">
          <div class="panel-header">
            <span class="panel-icon">📥</span>
            <h3>ထည့်သွင်းမှု — Transformation Matrix</h3>
          </div>

          <!-- 3x3 Matrix Input -->
          <div class="input-group">
            <label class="input-label">3×3 Matrix (row-major)</label>
            <div class="matrix-grid" id="matrix-input">
              <input type="number" class="input-field" value="1" step="0.1" id="m0">
              <input type="number" class="input-field" value="0" step="0.1" id="m1">
              <input type="number" class="input-field" value="0" step="0.1" id="m2">
              <input type="number" class="input-field" value="0" step="0.1" id="m3">
              <input type="number" class="input-field" value="1" step="0.1" id="m4">
              <input type="number" class="input-field" value="0" step="0.1" id="m5">
              <input type="number" class="input-field" value="0" step="0.1" id="m6">
              <input type="number" class="input-field" value="0" step="0.1" id="m7">
              <input type="number" class="input-field" value="1" step="0.1" id="m8">
            </div>
          </div>

          <!-- Presets -->
          <div class="input-group">
            <label class="input-label">အမြန်ရွေးချယ်စရာများ (Quick Presets)</label>
            <div style="display:flex; flex-wrap:wrap; gap:6px;">
              <button class="btn btn-outline btn-sm" id="preset-identity">Identity</button>
              <button class="btn btn-outline btn-sm" id="preset-rotation">Rotation 45°</button>
              <button class="btn btn-outline btn-sm" id="preset-scale">Scale</button>
              <button class="btn btn-outline btn-sm" id="preset-shear">Shear</button>
            </div>
          </div>

          <!-- Point Count -->
          <div class="input-group">
            <label class="input-label">နမူနာအမှတ်များ (Sample Points)</label>
            <div class="slider-container">
              <div class="slider-row">
                <input type="range" id="num-points" min="50" max="500" value="200" step="10">
                <span class="slider-value" id="num-points-val">200</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Output Panel -->
        <div class="panel animate-fade-in-up" style="animation-delay: 0.1s;">
          <div class="panel-header">
            <span class="panel-icon">📤</span>
            <h3>ရလဒ် — Matrix Analysis</h3>
          </div>
          <div id="output-results">
            <!-- Filled by simulation.js -->
          </div>
        </div>
      </div>

      <!-- 3D Viewport -->
      <div class="viewport-container animate-fade-in-up" style="animation-delay: 0.15s;">
        <div id="viewport" style="width:100%; height:100%;"></div>
        <div class="viewport-badge">🔢 Linear Algebra</div>
        <div class="viewport-hint">🖱️ လှည့်ရန် ဖိဆွဲပါ · ချုံ့/ချဲ့ရန် Scroll သုံးပါ</div>
      </div>

      <!-- AI Context -->
      <div class="ai-context animate-fade-in-up" id="ai-context" style="animation-delay: 0.2s;">
        <!-- Filled by simulation.js -->
      </div>
    </div>
  </main>

  <script type="module" src="simulation.js"></script>
</body>
</html>
