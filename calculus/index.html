<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Interactive 3D calculus simulation — visualize gradients, partial derivatives, and gradient descent on surfaces, powering AI backpropagation.">
  <title>Calculus — AI Math Toolkits</title>
  <link rel="stylesheet" href="../common/styles.css">
  <link rel="stylesheet" href="../common/components.css">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <!-- Navigation -->
  <header class="nav" id="nav-bar"></header>

  <!-- Main Layout -->
  <main class="page-body">
    <div class="sim-layout">
      <!-- Side Panel -->
      <div class="side-panel">
        <!-- Input Panel -->
        <div class="panel animate-fade-in-up">
          <div class="panel-header">
            <span class="panel-icon">📥</span>
            <h3>Function & Gradient</h3>
          </div>

          <!-- Function Selector -->
          <div class="input-group">
            <label class="input-label">Function f(x, y)</label>
            <select class="input-select" id="fn-select">
              <option value="paraboloid">Paraboloid: x² + y²</option>
              <option value="sincos">Wave: sin(x)·cos(y)</option>
              <option value="saddle">Saddle: x² − y²</option>
              <option value="rosenbrock">Rosenbrock (scaled)</option>
              <option value="gaussian">Gaussian Bump</option>
            </select>
          </div>

          <!-- Starting Point -->
          <div class="input-group">
            <label class="input-label">စတင်သည့်အမှတ် (Starting Point) x₀</label>
            <div class="slider-container">
              <div class="slider-row">
                <input type="range" id="start-x" min="-3" max="3" value="2" step="0.1">
                <span class="slider-value" id="start-x-val">2.00</span>
              </div>
            </div>
          </div>

          <div class="input-group">
            <label class="input-label">စတင်သည့်အမှတ် (Starting Point) y₀</label>
            <div class="slider-container">
              <div class="slider-row">
                <input type="range" id="start-y" min="-3" max="3" value="2" step="0.1">
                <span class="slider-value" id="start-y-val">2.00</span>
              </div>
            </div>
          </div>

          <!-- Learning Rate -->
          <div class="input-group">
            <label class="input-label">Learning Rate α</label>
            <div class="slider-container">
              <div class="slider-row">
                <input type="range" id="learning-rate" min="0.001" max="1.0" value="0.1" step="0.001">
                <span class="slider-value" id="learning-rate-val">0.100</span>
              </div>
            </div>
          </div>

          <button class="btn btn-primary btn-block" id="btn-run-descent">
            ▶ Gradient Descent ကို Run ပါ
          </button>
        </div>

        <!-- Output Panel -->
        <div class="panel animate-fade-in-up" style="animation-delay: 0.1s;">
          <div class="panel-header">
            <span class="panel-icon">📤</span>
            <h3>Gradient Analysis</h3>
          </div>
          <div id="output-results"></div>
        </div>
      </div>

      <!-- 3D Viewport -->
      <div class="viewport-container animate-fade-in-up" style="animation-delay: 0.15s;">
        <div id="viewport" style="width:100%; height:100%;"></div>
        <div class="viewport-badge">📐 Calculus</div>
        <div class="viewport-hint">🖱️ လှည့်ရန် ဖိဆွဲပါ · ချုံ့/ချဲ့ရန် Scroll သုံးပါ</div>
      </div>

      <!-- AI Context -->
      <div class="ai-context animate-fade-in-up" id="ai-context" style="animation-delay: 0.2s;"></div>
    </div>
  </main>

  <script type="module" src="simulation.js"></script>
</body>

</html>
